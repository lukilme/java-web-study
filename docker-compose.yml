services:
  tomcat:
    image: tomcat:9.0-jdk21-temurin
    container_name: java-tomcat
    depends_on:
      - db
    ports:
      - "8085:8080"
    volumes:
      - ./servlet-app/target/servlet-app-1.0-SNAPSHOT.war:/usr/local/tomcat/webapps/ROOT.war

  liferay:
    image: liferay/portal:7.4.3.112-ga112
    container_name: java-liferay
    ports:
      - "8086:8080"
    volumes:
      - ./portlet-app/target/portlet-app-1.0.0.jar:/opt/liferay/deploy/portlet-app.jar
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: java-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
